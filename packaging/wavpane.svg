<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- wavpane: the app's own look - dark pane, gray rim, white core, cyan amplitude line -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="#0a0a10"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="21.5" fill="none" stroke="#5a5a82" stroke-width="1"/>
  <line x1="16" y1="64" x2="112" y2="64" stroke="#5a5a82" stroke-width="2"/>
  <!-- rim (true min..max) -->
  <g fill="#96a0a8">
    <rect x="18" y="56" width="6" height="16" rx="1"/>
    <rect x="28" y="44" width="6" height="40" rx="1"/>
    <rect x="38" y="30" width="6" height="68" rx="1"/>
    <rect x="48" y="20" width="6" height="88" rx="1"/>
    <rect x="58" y="34" width="6" height="60" rx="1"/>
    <rect x="68" y="26" width="6" height="76" rx="1"/>
    <rect x="78" y="40" width="6" height="48" rx="1"/>
    <rect x="88" y="50" width="6" height="28" rx="1"/>
    <rect x="98" y="58" width="6" height="12" rx="1"/>
  </g>
  <!-- core -->
  <g fill="#ffffff">
    <rect x="18" y="60" width="6" height="8"/>
    <rect x="28" y="54" width="6" height="20"/>
    <rect x="38" y="46" width="6" height="36"/>
    <rect x="48" y="40" width="6" height="48"/>
    <rect x="58" y="48" width="6" height="32"/>
    <rect x="68" y="44" width="6" height="40"/>
    <rect x="78" y="52" width="6" height="24"/>
    <rect x="88" y="57" width="6" height="14"/>
    <rect x="98" y="61" width="6" height="6"/>
  </g>
  <line x1="12" y1="38" x2="116" y2="38" stroke="#00e6ff" stroke-width="3" stroke-linecap="round"/>
</svg>
